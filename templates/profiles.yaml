# Profile manifest. Each entry is one profile, built as both a VM template and
# an LXC container pair.
#
# Descriptions are implementation-neutral on purpose: they are copied verbatim
# into each guest's provenance file, and the two families implement Docker
# differently -- rootless on the VM, rootful inside an unprivileged container.
# Naming one of them here would make the other's provenance wrong.
#
# Profiles are enumerated explicitly rather than derived as a cross-product of
# flags, so adding a feature does not double the number of templates built.
#
# vmid_offset is added to VMID_START from tools/.env. Offsets must be unique.
# Template names carry no version: a rebuild replaces the existing template.
# Provenance lives in /etc/kasa-image-release inside the guest instead.

profiles:
  - name: base
    description: Hardened Debian agent host
    vmid_offset: 0
    flags:
      - remote_syslog

  - name: docker
    description: Hardened Debian agent host with Docker
    vmid_offset: 1
    flags:
      - docker
      - remote_syslog

  - name: base-local
    description: Hardened Debian agent host with durable local logging
    vmid_offset: 2
    flags: []

  - name: docker-local
    description: Hardened Debian agent host with Docker and durable local logging
    vmid_offset: 3
    flags:
      - docker
